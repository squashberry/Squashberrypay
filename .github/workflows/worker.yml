name: Deploy SquashberryPay Worker

on:
  push:
    branches:
      - master
    paths:
      - "server.js"
      - "worker.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e44f4d165493f23435c419ab105b9248
          wranglerVersion: "4"
          command: deploy
